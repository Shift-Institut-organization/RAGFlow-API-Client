info:
  name: Upload Documents
  type: http
  seq: 1
http:
  method: POST
  url: http://localhost:9222/api/v1/datasets/ds-1/documents
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "file-path"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
