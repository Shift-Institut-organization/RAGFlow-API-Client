info:
  name: Create Dataset
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:9222/api/v1/datasets
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Seniorenheim Auto",
        "parse_type": 1,
        "chunk_method": "naive",
        "pipeline_id": ""
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("datasetId", res.body.data.id)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
