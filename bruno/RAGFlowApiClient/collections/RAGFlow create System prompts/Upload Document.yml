info:
  name: Upload Document
  type: http
  seq: 2
http:
  method: POST
  url: http://localhost:9222/api/v1/documents/upload
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart-form
    data:
      - name: file
